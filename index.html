<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mil Universos Sob o Mesmo Céu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tela de Entrada -->
    <div class="tela-entrada" id="telaEntrada">
        <div class="capa-moldura">
            <h1 class="capa-titulo">Mil Universos Sob o Mesmo Céu</h1>

            <p class="capa-subtitulo">
                "Quinze ensinamentos em cada reino. Caminhai e aprendei."
            </p>

            <button class="botao-entrar" id="botaoEntrar">
                ⚔️ Entrai ⚔️
            </button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="conteudo" id="conteudo">

        <header>
            <h1>Os Seis Reinos da Sabedoria</h1>
            <p>"Cinco olhares, seis reinos de sabedoria, um mesmo céu."</p>
        </header>

        <!-- Menu dos Reinos -->
        <nav class="abas">

            <button class="aba-btn ativa" data-reino="prologo">
                📝 <span>Prólogo</span>
            </button>

            <button class="aba-btn" data-reino="emily">
                🌕 <span>Emily</span>
            </button>

            <button class="aba-btn" data-reino="pamela">
                🌌 <span>Pamela</span>
            </button>

            <button class="aba-btn" data-reino="jessica">
                🌸 <span>Jéssica</span>
            </button>

            <button class="aba-btn" data-reino="julia">
                🪷 <span>Julia</span>
            </button>

            <button class="aba-btn" data-reino="otavio">
                🌅 <span>Otávio</span>
            </button>

        </nav>

        <main class="container">

            <!-- COLE AQUI O CONTEÚDO DOS REINOS
                 QUE JÁ ESTÁ NO SEU ARQUIVO ORIGINAL -->

        </main>

        <footer>
            "Mil universos, um mesmo céu."
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
